[Service]
# docker.service is already ordered after network-online.target on the reference
# host. Apply before dockerd can restore published containers; verify Docker's
# backend and FORWARD ordering after the daemon reports ready.
ExecStartPre=/usr/local/sbin/alert2ir-splunk-adapter-firewall apply
ExecStartPost=/usr/local/sbin/alert2ir-splunk-adapter-firewall check
