app_mode = production

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = obs01.lab.test
root_url = http://obs01.lab.test:3000/

[database]
type = sqlite3
path = grafana.db

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
disable_gravatar = true

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[plugins]
preinstall_disabled = true

[log]
mode = console
level = info

[metrics]
enabled = true
