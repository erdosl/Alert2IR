name: alert2ir-observability

services:
  grafana:
    image: docker.io/grafana/grafana:13.1.3@sha256:e27e68cfd5795c1bea54950766078a02e84dfa3bafe0a4d0e5382f713dfd8e4e
    platform: linux/amd64
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana_secret_key
    secrets:
      - grafana_admin_password
      - grafana_secret_key
    volumes:
      - type: bind
        source: ${OBSERVABILITY_DATA_ROOT:?OBSERVABILITY_DATA_ROOT is required}/grafana
        target: /var/lib/grafana
      - type: bind
        source: ./grafana/grafana.ini
        target: /etc/grafana/grafana.ini
        read_only: true
      - type: bind
        source: ./grafana/provisioning/datasources/datasources.yml
        target: /etc/grafana/provisioning/datasources/datasources.yml
        read_only: true
      - type: bind
        source: ./grafana/provisioning/dashboards
        target: /etc/grafana/provisioning/dashboards
        read_only: true
      - type: bind
        source: ./grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
    ports:
      - "192.168.56.65:3000:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - observability_internal

  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.2@sha256:1147c92841726a6fef55fe6124491d6f85480f8de204f7d420304ca5bbd0a8f7
    platform: linux/amd64
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=12GB
      - --web.enable-remote-write-receiver
      - --no-web.enable-admin-api
    volumes:
      - type: bind
        source: ${OBSERVABILITY_DATA_ROOT:?OBSERVABILITY_DATA_ROOT is required}/prometheus
        target: /prometheus
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./prometheus/rules
        target: /etc/prometheus/rules
        read_only: true
    ports:
      - "127.0.0.1:19090:9090"
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - observability_internal

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.33.1@sha256:a89f8d4520954079275441eecdb71444328bd90633dd4eddfc33b9ed657f349b
    platform: linux/amd64
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - type: bind
        source: ${OBSERVABILITY_DATA_ROOT:?OBSERVABILITY_DATA_ROOT is required}/alertmanager
        target: /alertmanager
      - type: bind
        source: ./alertmanager/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - observability_internal

  loki:
    image: docker.io/grafana/loki:3.7.6@sha256:83c76da7858a8f4f88117ac521864ac33896fdae7a352a1df4068556e7513f64
    platform: linux/amd64
    command:
      - -target=all
      - -config.file=/etc/loki/loki.yml
    volumes:
      - type: bind
        source: ${OBSERVABILITY_DATA_ROOT:?OBSERVABILITY_DATA_ROOT is required}/loki
        target: /loki
      - type: bind
        source: ./loki/loki.yml
        target: /etc/loki/loki.yml
        read_only: true
    ports:
      - "127.0.0.1:13100:3100"
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/loki.yml", "-verify-config"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - observability_internal

  tempo:
    image: docker.io/grafana/tempo:3.0.3@sha256:05321ebf1f191fde34282b3dc86e68f511d489133df7963cd1670a2e1e11b33c
    platform: linux/amd64
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - type: bind
        source: ${OBSERVABILITY_DATA_ROOT:?OBSERVABILITY_DATA_ROOT is required}/tempo
        target: /var/tempo
      - type: bind
        source: ./tempo/tempo.yml
        target: /etc/tempo/tempo.yml
        read_only: true
    ports:
      - "127.0.0.1:14317:4317"
    expose:
      - "3200"
      - "4317"
    healthcheck:
      test: ["CMD", "/tempo", "-config.file=/etc/tempo/tempo.yml", "-config.verify=true"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - observability_internal

networks:
  observability_internal:

secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?GRAFANA_ADMIN_PASSWORD_FILE is required}
  grafana_secret_key:
    file: ${GRAFANA_SECRET_KEY_FILE:?GRAFANA_SECRET_KEY_FILE is required}
