title: Encoded Windows PowerShell Command
id: aebe017f-0dc6-4cae-8f07-6dc611963471
status: experimental
description: Detects Windows PowerShell process creation using encoded-command switch forms.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Alert2IR
date: 2026-08-13
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith: '\powershell.exe'
  selection_encoded_switch:
    CommandLine|contains:
      - '-e '
      - '-enc '
      - '-encodedcommand'
  condition: selection_image and selection_encoded_switch
falsepositives:
  - Legitimate administration, deployment, automation, or management tooling
level: medium
tags:
  - attack.execution
  - attack.t1059.001
