name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:7e6103cf85f88f7a0eddb3ec0b1ba8940eba098ed118ade25a729ca9daee5568 # postgres:18.4-bookworm, linux/amd64
        env:
          POSTGRES_USER: alert2ir_test
          POSTGRES_PASSWORD: alert2ir_test
          POSTGRES_DB: alert2ir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alert2ir_test -d alert2ir_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    env:
      ALERT2IR_TEST_DATABASE_URL: postgresql://alert2ir_test:alert2ir_test@127.0.0.1:5432/alert2ir_test
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Record provenance
        run: |
          python --version
          git rev-parse HEAD

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bind9-utils
          python -m pip install --requirement requirements-dev.txt
          python -m pip check

      - name: Run tests
        run: python -m unittest discover -v

  static-analysis:
    name: Shell and Puppet syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ruby-full shellcheck
          sudo gem install --no-document puppet --version 8.10.0

      - name: Record static-analysis provenance
        run: |
          ruby --version
          shellcheck --version
          puppet --version

      - name: Run ShellCheck
        run: |
          git ls-files -z '*.sh' |
            xargs -0 --no-run-if-empty shellcheck --

      - name: Validate canonical Alloy configuration
        shell: bash
        run: |
          for alloy_config in ir-core obs01; do
            docker run --rm --network none \
              -v "$PWD/observability/alloy/${alloy_config}.alloy:/etc/alloy/config.alloy:ro" \
              docker.io/grafana/alloy:v1.18.1@sha256:754409730f1a4ed9781f8a2ea3b6a8c55750ee125a267ecf8fb449f9a25c109a \
              validate /etc/alloy/config.alloy
          done

      - name: Validate Puppet 8 DSL syntax compatibility
        shell: bash
        run: |
          test "$(puppet --version)" = '8.10.0'
          mapfile -d '' manifests < <(
            git ls-files -z 'infra/puppet/**/*.pp'
          )
          ((${#manifests[@]} > 0))
          puppet parser validate "${manifests[@]}"

  sigma-contracts:
    name: Sigma contracts
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Record provenance
        run: |
          python --version
          git rev-parse HEAD

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-sigma.txt
          python -m pip check

      - name: Verify Sigma toolchain
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import re
          import sys

          required = {"sigma-cli", "pysigma", "pysigma-backend-splunk"}
          expected = {}
          for line_number, raw_line in enumerate(
              Path("requirements-sigma.txt").read_text(
                  encoding="utf-8"
              ).splitlines(),
              start=1,
          ):
              requirement = raw_line.partition("#")[0].strip()
              if not requirement:
                  continue
              match = re.fullmatch(
                  r"([A-Za-z0-9][A-Za-z0-9_.-]*)==([^\s;]+)",
                  requirement,
              )
              if match is None:
                  raise SystemExit(
                      "requirements-sigma.txt:"
                      f"{line_number} is not an exact == pin"
                  )
              distribution = re.sub(
                  r"[-_.]+", "-", match.group(1)
              ).lower()
              if distribution in expected:
                  raise SystemExit(
                      "requirements-sigma.txt:"
                      f"{line_number} duplicates {distribution}"
                  )
              expected[distribution] = match.group(2)
          if set(expected) != required:
              raise SystemExit(
                  "requirements-sigma.txt must contain exactly "
                  f"{sorted(required)!r}, got {sorted(expected)!r}"
              )
          actual = {name: version(name) for name in expected}
          sigma = Path(sys.executable).with_name("sigma")
          if actual != expected:
              raise SystemExit(
                  f"unexpected Sigma direct versions: {actual!r}"
              )
          if not sigma.is_file():
              raise SystemExit(f"Sigma executable not found: {sigma}")
          print(f"Sigma executable: {sigma}")
          print(f"Sigma direct versions: {actual}")
          PY

      - name: Prepare pinned Sigma validation data
        shell: bash
        run: |
          sigma_root="$(mktemp -d "${RUNNER_TEMP}/alert2ir-sigma.XXXXXX")"
          python tools/sigma/prepare_validation_data.py \
            --metadata config/sigma/validation-data.json \
            --download-directory "$sigma_root/downloads" \
            --cache-home "$sigma_root/home"
          echo "ALERT2IR_SIGMA_HOME=$sigma_root/home" >> "$GITHUB_ENV"

      - name: Run Sigma contracts
        run: |
          python -m unittest -v \
            tests.test_sigma_detection_contract \
            tests.test_sigma_toolchain_contract
